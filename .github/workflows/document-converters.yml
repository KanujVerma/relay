name: Optional synthetic document converter evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'relay_spike/document_*.py'
      - 'relay_spike/resume_candidates.py'
      - 'requirements-documents.txt'
      - 'tests/test_document_*.py'
      - 'tests/fixtures/documents/**'
      - 'tests/fixtures/document-worker/**'
      - 'EVALS/benchmark_documents.py'
      - 'docs/DOCUMENT_CONVERTERS.md'
      - '.github/workflows/document-converters.yml'

permissions:
  contents: read

concurrency:
  group: document-converters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-documents.txt
      - name: Install pinned optional document dependencies
        run: python -m pip install -r requirements-documents.txt
      - name: Install pinned offline stream test dependencies
        run: python -m pip install httpx==0.28.1 PyJWT==2.15.1 cryptography==50.0.2
      - name: Validate fixture schema and coverage
        run: python EVALS/validate.py
      - name: Validate documentation and local links
        run: python EVALS/verify_docs.py
      - name: Run existing tests
        run: python -m unittest discover -s tests -v
      - name: Run worker-owned document integration tests with zero skips
        env:
          RELAY_DOCUMENT_INTEGRATION: '1'
        run: python -m unittest discover -s tests -p 'test_document_conversion*.py' -v
      - name: Run mandatory real-library acceptance with zero skips
        env:
          RELAY_DOCUMENT_INTEGRATION: '1'
        run: python -m unittest discover -s tests -p test_document_acceptance.py -v
      - name: Benchmark fabricated documents only
        run: python EVALS/benchmark_documents.py
