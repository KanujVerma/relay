name: Contract and documentation checks

on:
  pull_request:
    paths:
      - 'EVALS/**'
      - 'relay_spike/**'
      - 'tests/**'
      - 'requirements-spike.txt'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'HANDOFF.md'
      - 'PRODUCT.md'
      - 'ARCHITECTURE.md'
      - 'ROLE_PACKS/**'
      - '.github/workflows/contract.yml'
  push:
    branches: [main]
    paths:
      - 'EVALS/**'
      - '.github/workflows/contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixture schema and coverage
        run: python3 EVALS/validate.py
      - name: Validate documentation and local links
        run: python3 EVALS/verify_docs.py
      - name: Test OAuth and streaming failure paths (offline only)
        run: python3 -m unittest discover -s tests -v
